{% extends 'base.html' %}
{% block content %}
<section id="skills" class="fade-up">
  <h3 class="section-title"><i class="fas fa-lightbulb section-icon"></i> Skills</h3>

  <div class="skills-container">
    <!-- Programming Languages -->
    <div class="skill-card">
      <i class="fas fa-code skill-icon"></i>
      <h4>Programming</h4>
      <p>Python, Flask, SQL, C, C++, PHP</p>
    </div>

    <!-- Web Development -->
    <div class="skill-card">
      <i class="fas fa-globe skill-icon"></i>
      <h4>Web Development</h4>
      <p>HTML, CSS, JavaScript, TypeScript</p>
    </div>

    <!-- Data Science -->
    <div class="skill-card">
      <i class="fas fa-database skill-icon"></i>
      <h4>Data & AI</h4>
      <p>Data Analysis, Data Engineering, Machine Learning, Deep Learning</p>
    </div>

    <!-- Languages -->
    <div class="skill-card">
      <i class="fas fa-language skill-icon"></i>
      <h4>Languages</h4>

      <div class="language-skill">
        <span>English</span>
        <div class="bar"><div class="progress" style="width: 100%;"></div></div>
      </div>

      <div class="language-skill">
        <span>Bengali</span>
        <div class="bar"><div class="progress" style="width: 100%;"></div></div>
      </div>

      <div class="language-skill">
        <span>Hindi & Urdu</span>
        <div class="bar"><div class="progress" style="width: 70%;"></div></div>
      </div>

      <div class="language-skill">
        <span>Norsk</span>
        <div class="bar"><div class="progress" style="width: 40%;"></div></div>
      </div>
    </div>
  </div>
</section>

<style>
.skills-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 15px;
}

.skill-card {
  background: #1e293b;
  color: #fff;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.skill-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.3);
}

.skill-icon {
  font-size: 2rem;
  color: #3b82f6;
  margin-bottom: 10px;
}

.skill-card h4 {
  margin-bottom: 12px;
  font-size: 1.2rem;
}

.skill-card p {
  font-size: 0.9rem;
  line-height: 1.4;
}

/* Languages with Progress Bars */
.language-skill {
  margin-bottom: 12px;
  text-align: left;
}

.language-skill span {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  font-size: 0.9rem;
}

.bar {
  background: #334155;
  border-radius: 6px;
  overflow: hidden;
  height: 10px;
}

.progress {
  background: #3b82f6;
  height: 100%;
  transition: width 0.5s ease;
}
</style>
{% endblock %}
